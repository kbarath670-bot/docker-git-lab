name: Deploy PHP Application

on:
  push:
    branches:
      - main
    paths:
      - "php-app/**"
      - ".github/workflows/deploy-php.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy PHP Application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/git-projects/docker-git-lab

            git pull origin main

            cd php-app

            docker stop employee-php || true
            docker rm employee-php || true

            docker build -t employee-php:latest .

            docker run -d \
              --name employee-php \
              -p 8081:80 \
              employee-php:latest

            docker ps